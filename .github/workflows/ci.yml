# Runs on every push / pull request: build -> SEO rules -> Lighthouse budgets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - name: SEO checks (titles, descriptions, H1, canonical, JSON-LD, links, sitemap)
        run: python tools/check_seo.py --site out
      - name: Lighthouse CI (mobile)
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-and-lighthouse-reports
          path: reports/
