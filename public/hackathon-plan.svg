<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="hp-title hp-desc">
  <title id="hp-title">24-hour hackathon timeline overview</title>
  <desc id="hp-desc">Four-stage diagram showing hours 0-3 setup, hours 3-14 core build, hours 14-21 integration and testing, and hours 21-24 submission and demo.</desc>
  <rect width="720" height="340" rx="20" fill="#22264b"/>
  <text x="40" y="48" fill="#ffb627" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">24-HOUR HACKATHON WORKFLOW</text>
  <text x="40" y="76" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">From problem statement to working demo</text>
  <!-- Stage 1 -->
  <rect x="40" y="110" width="148" height="175" rx="14" fill="#33386b"/>
  <rect x="40" y="110" width="148" height="8" rx="4" fill="#ff6b35"/>
  <text x="56" y="146" fill="#ffb627" font-family="system-ui, sans-serif" font-size="13" font-weight="700">HOURS 0–3</text>
  <text x="56" y="174" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Scope &amp; Setup</text>
  <text x="56" y="204" fill="#d9dcef" font-family="system-ui, sans-serif" font-size="13">Pick track</text>
  <text x="56" y="226" fill="#d9dcef" font-family="system-ui, sans-serif" font-size="13">Freeze MVP</text>
  <text x="56" y="248" fill="#d9dcef" font-family="system-ui, sans-serif" font-size="13">Init Git repo</text>
  <!-- Stage 2 -->
  <rect x="204" y="110" width="148" height="175" rx="14" fill="#33386b"/>
  <rect x="204" y="110" width="148" height="8" rx="4" fill="#2ec4b6"/>
  <text x="220" y="146" fill="#2ec4b6" font-family="system-ui, sans-serif" font-size="13" font-weight="700">HOURS 3–14</text>
  <text x="220" y="174" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Core Build</text>
  <text x="220" y="204" fill="#d9dcef" font-family="system-ui, sans-serif" font-size="13">Build main flow</text>
  <text x="220" y="226" fill="#d9dcef" font-family="system-ui, sans-serif" font-size="13">Mentor check 1</text>
  <text x="220" y="248" fill="#d9dcef" font-family="system-ui, sans-serif" font-size="13">Take rest turns</text>
  <!-- Stage 3 -->
  <rect x="368" y="110" width="148" height="175" rx="14" fill="#33386b"/>
  <rect x="368" y="110" width="148" height="8" rx="4" fill="#ffb627"/>
  <text x="384" y="146" fill="#ffb627" font-family="system-ui, sans-serif" font-size="13" font-weight="700">HOURS 14–21</text>
  <text x="384" y="174" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Integrate</text>
  <text x="384" y="204" fill="#d9dcef" font-family="system-ui, sans-serif" font-size="13">Connect UI + API</text>
  <text x="384" y="226" fill="#d9dcef" font-family="system-ui, sans-serif" font-size="13">Mentor check 2</text>
  <text x="384" y="248" fill="#d9dcef" font-family="system-ui, sans-serif" font-size="13">Fix edge cases</text>
  <!-- Stage 4 -->
  <rect x="532" y="110" width="148" height="175" rx="14" fill="#33386b"/>
  <rect x="532" y="110" width="148" height="8" rx="4" fill="#ff6b35"/>
  <text x="548" y="146" fill="#ff6b35" font-family="system-ui, sans-serif" font-size="13" font-weight="700">HOURS 21–24</text>
  <text x="548" y="174" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Ship &amp; Pitch</text>
  <text x="548" y="204" fill="#d9dcef" font-family="system-ui, sans-serif" font-size="13">Record 2m video</text>
  <text x="548" y="226" fill="#d9dcef" font-family="system-ui, sans-serif" font-size="13">Update README</text>
  <text x="548" y="248" fill="#d9dcef" font-family="system-ui, sans-serif" font-size="13">Submit before 6 PM</text>
</svg>
