<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Schematic campus map for INNOVEX 2027</title>
  <desc id="map-desc">Schematic layout showing Main Gate at the bottom left, Parking nearby, a central walkway leading to Innovation Block, Atrium, Main Auditorium and Labs 1 to 5.</desc>
  <rect width="720" height="420" rx="20" fill="#f3f4fa"/>
  <!-- Campus roads / walkways -->
  <path d="M 90 360 L 90 220 L 340 220 L 340 130" stroke="#d5d8e6" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 340 220 L 560 220" stroke="#d5d8e6" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M 90 300 L 210 300" stroke="#d5d8e6" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Main Gate -->
  <rect x="30" y="340" width="120" height="50" rx="10" fill="#22264b"/>
  <text x="90" y="370" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Main Gate</text>
  <!-- Parking -->
  <rect x="190" y="275" width="120" height="50" rx="10" fill="#ffffff" stroke="#22264b" stroke-width="2"/>
  <text x="250" y="305" text-anchor="middle" fill="#22264b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Parking</text>
  <!-- Innovation Block -->
  <rect x="220" y="50" width="240" height="90" rx="14" fill="#22264b"/>
  <text x="340" y="90" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Innovation Block</text>
  <text x="340" y="114" text-anchor="middle" fill="#ffb627" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Check-in Lobby &amp; Hack Hall</text>
  <!-- Atrium -->
  <rect x="265" y="185" width="150" height="70" rx="12" fill="#e9f8f6" stroke="#0f766e" stroke-width="2"/>
  <text x="340" y="218" text-anchor="middle" fill="#0f766e" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Atrium</text>
  <text x="340" y="238" text-anchor="middle" fill="#1a1c2e" font-family="system-ui, sans-serif" font-size="12">Project Expo</text>
  <!-- Main Auditorium -->
  <rect x="490" y="165" width="190" height="110" rx="14" fill="#ff6b35"/>
  <text x="585" y="214" text-anchor="middle" fill="#1a1c2e" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Main Auditorium</text>
  <text x="585" y="236" text-anchor="middle" fill="#1a1c2e" font-family="system-ui, sans-serif" font-size="12">Talks, Opening &amp; Finals</text>
  <!-- Labs 1-5 -->
  <rect x="40" y="140" width="160" height="100" rx="12" fill="#ffffff" stroke="#5b5fc7" stroke-width="2.5"/>
  <text x="120" y="184" text-anchor="middle" fill="#22264b" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Labs 1–5</text>
  <text x="120" y="206" text-anchor="middle" fill="#55597a" font-family="system-ui, sans-serif" font-size="12">Workshops &amp; Code Sprint</text>
  <!-- Walking route indicator -->
  <circle cx="90" cy="340" r="6" fill="#ff6b35"/>
  <circle cx="340" cy="140" r="6" fill="#ff6b35"/>
  <text x="585" y="370" text-anchor="middle" fill="#55597a" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Schematic map (not to scale)</text>
</svg>
