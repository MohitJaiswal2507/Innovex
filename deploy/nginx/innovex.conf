# Nginx server block for the Next.js static export (out/). setup_vps.sh replaces __DOMAIN__.
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;
    root /var/www/__DOMAIN__;
    index index.html;

    # One canonical host: www -> root (Certbot adds the HTTP -> HTTPS redirect)
    if ($host = www.__DOMAIN__) { return 301 https://__DOMAIN__$request_uri; }

    # Trailing-slash URLs map to folder/index.html (next.config.ts: trailingSlash: true)
    location / { try_files $uri $uri/ $uri.html =404; }
    error_page 404 /404.html;

    # Hashed build assets never change -> cache for a year
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(svg|png|jpg|jpeg|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~ /\.(git|ht) { deny all; }
}
